name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "대상 릴리즈 태그 (비우면 실행된 ref 이름 사용). main 브랜치에서 기존 릴리즈에 자산을 추가할 때 지정."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS는 universal binary(Apple Silicon + Intel)로 빌드하기 위해 두 타겟 모두 설치
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install npm dependencies
        run: npm ci

      # Tauri 번들러는 APPLE_CERTIFICATE 등이 "존재하기만" 해도(빈 문자열이어도) 서명을 시도한다.
      # 시크릿이 비어있는 채로 env에 주입하면 빈 인증서 import가 실패하므로,
      # 시크릿이 실제로 채워진 경우에만 GITHUB_ENV에 등록해 env var 자체가 없도록 한다.
      - name: configure macOS signing env
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # macOS만 universal-apple-darwin(Apple Silicon + Intel 통합 바이너리)로 빌드
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Whooing Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download this version."
          releaseDraft: true
          prerelease: false

      # 웹사이트 다운로드 링크가 릴리즈마다 안 바뀌도록, 버전 정보 없는 고정 파일명 사본을
      # 같은 릴리즈에 추가로 올린다. https://github.com/<repo>/releases/latest/download/<파일명>
      # 형태로 항상 최신 릴리즈의 이 사본을 가리킬 수 있다.
      - name: upload version-less stable-name copies (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | head -n1)
          cp "$dmg" "Whooing_macOS_universal.dmg"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_macOS_universal.dmg" --clobber

      - name: upload version-less stable-name copies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          msi=$(find src-tauri/target -path "*/bundle/msi/*.msi" | head -n1)
          exe=$(find src-tauri/target -path "*/bundle/nsis/*.exe" | head -n1)
          cp "$msi" "Whooing_Windows_x64.msi"
          cp "$exe" "Whooing_Windows_x64-setup.exe"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_Windows_x64.msi" "Whooing_Windows_x64-setup.exe" --clobber

      - name: upload version-less stable-name copies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target -path "*/bundle/deb/*.deb" | head -n1)
          rpm=$(find src-tauri/target -path "*/bundle/rpm/*.rpm" | head -n1)
          appimage=$(find src-tauri/target -path "*/bundle/appimage/*.AppImage" | head -n1)
          cp "$deb" "Whooing_Linux_amd64.deb"
          cp "$rpm" "Whooing_Linux_x86_64.rpm"
          cp "$appimage" "Whooing_Linux_amd64.AppImage"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_Linux_amd64.deb" "Whooing_Linux_x86_64.rpm" "Whooing_Linux_amd64.AppImage" --clobber
