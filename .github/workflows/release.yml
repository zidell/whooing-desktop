name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "대상 릴리즈 태그 (비우면 실행된 ref 이름 사용). main 브랜치에서 기존 릴리즈에 자산을 추가할 때 지정."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS는 universal binary(Apple Silicon + Intel)로 빌드하기 위해 두 타겟 모두 설치
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install npm dependencies
        run: npm ci

      # 태그(또는 workflow_dispatch의 tag 입력)에서 "v" 접두사를 뗀 버전 문자열을
      # tauri.conf.json / Cargo.toml에 반영해서, 실제 앱에 표시되는 버전과
      # 커밋된 소스 파일의 정적 버전이 릴리즈마다 어긋나지 않게 한다.
      - name: sync app version with release tag
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ inputs.tag || github.ref_name }}"
          ver="${ver#v}"
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          " "$ver"
          sed -i.bak "s/^version = \".*\"/version = \"$ver\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          echo "MSIX_VERSION=$ver.0" >> "$GITHUB_ENV"

      # Tauri 번들러는 APPLE_CERTIFICATE 등이 "존재하기만" 해도(빈 문자열이어도) 서명을 시도한다.
      # 시크릿이 비어있는 채로 env에 주입하면 빈 인증서 import가 실패하므로,
      # 시크릿이 실제로 채워진 경우에만 GITHUB_ENV에 등록해 env var 자체가 없도록 한다.
      - name: configure macOS signing env
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # macOS만 universal-apple-darwin(Apple Silicon + Intel 통합 바이너리)로 빌드
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Whooing Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download this version."
          releaseDraft: false
          prerelease: false

      # 웹사이트 다운로드 링크가 릴리즈마다 안 바뀌도록, 버전 정보 없는 고정 파일명 사본을
      # 같은 릴리즈에 추가로 올린다. https://github.com/<repo>/releases/latest/download/<파일명>
      # 형태로 항상 최신 릴리즈의 이 사본을 가리킬 수 있다.
      - name: upload version-less stable-name copies (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | head -n1)
          cp "$dmg" "Whooing_macOS_universal.dmg"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_macOS_universal.dmg" --clobber

      - name: upload version-less stable-name copies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          msi=$(find src-tauri/target -path "*/bundle/msi/*.msi" | head -n1)
          exe=$(find src-tauri/target -path "*/bundle/nsis/*.exe" | head -n1)
          cp "$msi" "Whooing_Windows_x64.msi"
          cp "$exe" "Whooing_Windows_x64-setup.exe"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_Windows_x64.msi" "Whooing_Windows_x64-setup.exe" --clobber

      # MS Store 제출용 MSIX. PWABuilder가 만드는 별개의 PWA 래퍼 대신, 이 레포가
      # 실제로 빌드한 Tauri 앱을 Desktop Bridge 방식으로 MSIX에 담는다.
      # Package Identity/Publisher는 Partner Center의 기존 앱(Store ID 9ND7MPSBWTL1)
      # 등록 값과 정확히 일치해야 "새 앱"이 아니라 "업데이트"로 인식된다.
      - name: locate Windows SDK tools for MSIX
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem -Path $sdkRoot -Recurse -Filter "makeappx.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under $sdkRoot" }
          if (-not $signtool) { throw "signtool.exe not found under $sdkRoot" }
          "MAKEAPPX_PATH=$($makeappx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: build MSIX package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $payload = "msix-payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item "src-tauri\target\release\whooing-desktop.exe" "$payload\whooing-desktop.exe"
          Copy-Item "src-tauri\icons\Square44x44Logo.png" "$payload\Square44x44Logo.png"
          Copy-Item "src-tauri\icons\Square150x150Logo.png" "$payload\Square150x150Logo.png"
          Copy-Item "src-tauri\icons\StoreLogo.png" "$payload\StoreLogo.png"

          $manifest = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:uap10="http://schemas.microsoft.com/appx/manifest/uap/windows10/10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap uap10 rescap">
            <Identity Name="7061CE15.591355A585FB1" Publisher="CN=3180036E-B428-4A8F-BD38-E4C6B5C64CBB" Version="__MSIX_VERSION__" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>후잉가계부</DisplayName>
              <PublisherDisplayName>후잉가계부</PublisherDisplayName>
              <Logo>StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="WhooingDesktop" Executable="whooing-desktop.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="후잉가계부" Description="Whooing (whooing.com) desktop app"
                  Square150x150Logo="Square150x150Logo.png" Square44x44Logo="Square44x44Logo.png"
                  BackgroundColor="#464646" />
              </Application>
            </Applications>
          </Package>
          '@
          $manifest = $manifest -replace "__MSIX_VERSION__", $env:MSIX_VERSION
          Set-Content -Path "$payload\AppxManifest.xml" -Value $manifest -Encoding utf8

          & $env:MAKEAPPX_PATH pack /d $payload /p Whooing_Windows_x64.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed with exit code $LASTEXITCODE" }

          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -Subject "CN=3180036E-B428-4A8F-BD38-E4C6B5C64CBB" -FriendlyName "whooing-desktop-msix-ci"
          $password = ConvertTo-SecureString -String "ci-build-only" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath ci-signing.pfx -Password $password | Out-Null
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f ci-signing.pfx /p "ci-build-only" Whooing_Windows_x64.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

      - name: upload MSIX to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_Windows_x64.msix" --clobber

      - name: upload version-less stable-name copies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target -path "*/bundle/deb/*.deb" | head -n1)
          rpm=$(find src-tauri/target -path "*/bundle/rpm/*.rpm" | head -n1)
          appimage=$(find src-tauri/target -path "*/bundle/appimage/*.AppImage" | head -n1)
          cp "$deb" "Whooing_Linux_amd64.deb"
          cp "$rpm" "Whooing_Linux_x86_64.rpm"
          cp "$appimage" "Whooing_Linux_amd64.AppImage"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Whooing_Linux_amd64.deb" "Whooing_Linux_x86_64.rpm" "Whooing_Linux_amd64.AppImage" --clobber
