name: auto-tag

# main에 push될 때마다 patch 버전을 자동으로 올려 태그를 만든다.
# 기본 GITHUB_TOKEN으로 push한 태그는 release.yml의 push 트리거를 (무한루프
# 방지 정책 때문에) 발동시키지 못하므로, 태그를 만든 뒤 release.yml의
# workflow_dispatch를 명시적으로 호출해서 이어준다.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: compute next patch version
        id: next
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

      - name: trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag="${{ steps.next.outputs.tag }}"
